appId: studio.alpinova.dropsauce
---
- launchApp:
    clearState: true
- launchApp
- extendedWaitUntil:
    visible: 'Start your kitchen'
    timeout: 60000
- openLink: dropsauce://e2e
- extendedWaitUntil:
    visible: 'E2E home scenarios'
    timeout: 10000
- tapOn:
    id: e2e-home-empty
- assertVisible: 'Your kitchen is just getting started.'
